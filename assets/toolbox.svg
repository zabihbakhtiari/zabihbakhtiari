<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Toolbox. Click to see everything else I build."><title>Toolbox. Click to see everything else I build.</title><defs><style>@font-face{font-family:'ST';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MO';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MB';src:url(data:font/woff2;base64,) format('woff2');}text{font-variant-ligatures:none}.draw{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.6,0,.3,1) both}.fade{animation:fade .6s ease-out both}.tape{animation:tape 2.4s linear infinite}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes tape{from{transform:translateX(0)}to{transform:translateX(39.6px)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><pattern id="gf" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#21477D" stroke-width="1"/></pattern><pattern id="gm" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gf)"/><path d="M100 0H0V100" fill="none" stroke="#2A5591" stroke-width="1.2"/></pattern><radialGradient id="vg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0E2445" stop-opacity=".55"/></radialGradient><pattern id="hzt" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#FFD23F"/><rect width="14" height="28" fill="#0E2445"/></pattern><clipPath id="hztc"><rect x="0" y="0" width="1200" height="14"/></clipPath><pattern id="hzb" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#FFD23F"/><rect width="14" height="28" fill="#0E2445"/></pattern><clipPath id="hzbc"><rect x="0" y="126" width="1200" height="14"/></clipPath></defs><rect width="1200" height="140" fill="#17345F"/><rect width="1200" height="140" fill="url(#gm)"/><rect width="1200" height="140" fill="url(#vg)"/><g clip-path="url(#hztc)"><rect class="tape" x="-60" y="0" width="1320" height="14" fill="url(#hzt)"/></g><g clip-path="url(#hzbc)"><rect class="tape" x="-60" y="126" width="1320" height="14" fill="url(#hzb)"/></g><path d="M64 52v-10h32v10" fill="none" stroke="#EAF0F8" stroke-width="3"/><rect x="40" y="52" width="80" height="50" fill="#FFD23F" stroke="#0E2445" stroke-width="2"/><path d="M40 70H120" stroke="#0E2445" stroke-width="2"/><rect x="74" y="64" width="12" height="12" fill="#0E2445"/><text x="150.0" y="70.0" font-family="ST,Impact,'Arial Narrow',sans-serif" font-size="34" fill="#EAF0F8" text-anchor="start" >More from the toolbox</text><text x="150.0" y="100.0" font-family="MO,ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#9DB3D2" text-anchor="start" >Everything else I build and fix for clients</text><rect x="1000" y="44" width="160" height="52" fill="#FFD23F" stroke="#0E2445" stroke-width="2"/><text x="1068.0" y="76.0" font-family="MB,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#0E2445" text-anchor="middle" >Open</text><path d="M1118 63l10 7-10 7z" fill="#0E2445" style="animation:blink 1.2s steps(1) 1s infinite"/></svg>